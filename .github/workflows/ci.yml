name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/stage-last-workout.mjs --self-test
      - run: node scripts/fetch-last-workout.mjs --fixture scripts/fixtures/strava-activities.json
