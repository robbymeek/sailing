<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- On-brand paint before the JS bundle mounts, so first load isn't a white
         flash on the dark pages. React sets the real per-route body background
         once it runs (App.jsx), so the loaded site is unchanged. -->
    <style>html, body { background: #13171f; }</style>
    <title>Robby Meek | LA2028 Olympic Sailing Campaign</title>
    <meta name="description" content="Official site of Robby Meek — Olympic hopeful and sailing athlete. Bio, partners, updates, and events from his road to LA 2028." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#13171f" />
    <link rel="canonical" href="https://robbysailing.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Robby Meek | LA2028 Olympic Sailing Campaign" />
    <meta property="og:description" content="Harvard student and US ODP sailor campaigning for the 2028 Olympics in Los Angeles. Follow the journey." />
    <meta property="og:image" content="https://robbysailing.com/og-preview.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://robbysailing.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Robby Meek | LA2028 Olympic Sailing Campaign" />
    <meta name="twitter:description" content="Harvard student and US ODP sailor campaigning for the 2028 Olympics in Los Angeles." />
    <meta name="twitter:image" content="https://robbysailing.com/og-preview.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
